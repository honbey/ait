services:
  ait:
    build: .
    image: ait:local
    container_name: ait
    ports:
      - "8000:8000"
    environment:
      # Required: initial admin password for the Web console
      AIT_AUTH_BOOTSTRAP_PASSWORD: "change-me"
      # Optional overrides (AIT_<SECTION>_<KEY>)
      # AIT_AUTH_BOOTSTRAP_USERNAME: "admin"
      # AIT_SERVER_PORT: "8000"
      # AIT_LOG_RETENTION_DAYS: "30"
    volumes:
      - ait-data:/app/data
    restart: unless-stopped

volumes:
  ait-data:
