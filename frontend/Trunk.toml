[build]
target = "index.html"
dist = "dist"
minify = "on_release"

[tools]
tailwindcss = "4.3.0"

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
  "-c",
  "mkdir -p assets/echarts-6.1.0 && test -f assets/echarts-6.1.0/echarts.min.js || curl -sSfLo assets/echarts-6.1.0/echarts.min.js https://raw.githubusercontent.com/apache/echarts/refs/tags/6.1.0/dist/echarts.min.js; test -d assets/fontawesome-free-7.3.0-web/css || (curl -sSfLo /tmp/fa.zip https://use.fontawesome.com/releases/v7.3.0/fontawesome-free-7.3.0-web.zip && unzip -qo /tmp/fa.zip -d assets/ && rm /tmp/fa.zip && rm -rf assets/fontawesome-free-7.3.0-web/js assets/fontawesome-free-7.3.0-web/less assets/fontawesome-free-7.3.0-web/scss assets/fontawesome-free-7.3.0-web/sprites assets/fontawesome-free-7.3.0-web/svgs)",
]
