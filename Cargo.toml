[workspace]
members = [".", "frontend"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["honbey"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stream utilities
futures-util = "0.3"

[package]
name = "ait"
version.workspace = true
edition.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false

[profile.release-wasm]
inherits = "release"
opt-level = "z"
# Trunk's wasm-opt pass keeps the name section otherwise.
strip = true
# NOTE: panic = "abort" is deliberately NOT set here. The profile is
# workspace-wide, and the backend's run_guarded (analytics) relies on
# unwinding to contain panics.

[profile.dev]
debug = "line-tables-only"
# Do NOT set `panic = "abort"`: it turns any panic in a request path —
# including arithmetic overflow, which is enabled below — into a process-wide
# denial of service instead of a failed request.
opt-level = 1
lto = false
incremental = true
overflow-checks = true
rpath = false
codegen-units = 2

[profile.dev.package."*"]
debug = "line-tables-only"
opt-level = 0
codegen-units = 2

[dependencies]
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true

# Async runtime
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7", default-features = false }

# HTTP server
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.7", features = ["trace", "fs", "cors", "compression-gzip"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "blocking",
] }

# Config
config = "0.15"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Bytes
bytes = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# Random token generation
rand = "0.10"

# Key hashing
sha2 = "0.11"
hex = "0.4"

# Concurrent hashmap
dashmap = "6.2"

# Multi-pattern substring matching (DLP sensitive-value scan)
aho-corasick = "1"
duckdb = { version = "1.10504.0", features = ["bundled", "chrono"] }

# Enum utilities
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
