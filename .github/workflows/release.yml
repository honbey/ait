name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          curl -sSfLo trunk.tar.gz \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar xzf trunk.tar.gz
          sudo mv trunk /usr/local/bin/

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-

      - name: Build frontend
        working-directory: frontend
        run: trunk build --release --cargo-profile release-wasm

      - name: Build backend
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/ait dist/
          cp -r frontend/dist dist/frontend/
          tar czf ait-${{ github.ref_name }}-x86_64-linux.tar.gz -C dist .

      - name: Extract release body from CHANGELOG
        run: |
          python3 -c "
          tag='${{ github.ref_name }}'; s='## ['+tag
          p=0
          with open('CHANGELOG.md') as f:
           for l in f:
            if l.startswith(s): p=1
            if p==1: print(l,end=''); p=2
            elif p==2:
             if l.startswith('## ['): break
             print(l,end='')
          " > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ait-${{ github.ref_name }}-x86_64-linux.tar.gz
          body_path: /tmp/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
